ture.",ecosystemBody:"MRIA can hold open pathways, guided courses, interdisciplinary programs, and institutional partnerships while each community keeps its own identity.",ecosystem:[["Open pathways","Enter freely. Follow a question through seven movements without an account.","For every learner","01"],["Guided courses","Study with an educator through adaptive preparation, live dialogue, and practice.","For cohorts and communities","02"],["Formation programs","Connect courses into longer journeys for transitions, vocation, and public life.","For lifelong formation","03"],["Institutional commons","Let schools and organizations contribute their strengths within a shared ecosystem.","For partners","04"]],partnersLabel:"FOR EDUCATORS & INSTITUTIONS",partnersTitle:"Bring your identity. Join a shared learning commons.",partnersBody:"MRIA is designed for partnership, not absorption. Educators keep their voice. Institutions keep their identity. The shared architecture connects learning, dialogue, facilitation, and embodied participation across boundaries.",partnerItems:["Co-design a bilingual course","Host a facilitated cohort","Connect a program or credential","Research relational formation"],partnerCta:"Start a partnership conversation",aboutLabel:"METAREALITY RELATIONAL INTELLIGENCE ARCHITECTURE",aboutTitle:"Technology belongs inside relationship—not above it.",aboutBody:"MRIA is a living relational field where persons, communities, cultures, histories, and technologies become together. MetaGenesis generates. MetaWay moves. MetaCommon gathers. Technology supports the journey, while wisdom, care, judgment, and sacred presence remain human and communal.",core:[["MetaGenesis","Generate","New questions, meaning, and possibility emerge."],["MetaWay","Move","People discern and cross between worlds."],["MetaCommon","Gather","Learning becomes love, service, and shared life."]],finalTitle:"Begin where your question stands.",finalBody:"You do not need to understand the whole archi ,principleLabel:"MRIA가 존재하는 이유",principleTitle:"대부분의 플랫폼은 “무엇을 완료했나요?”라고 묻습니다.",principleAccent:"MRIA는 “우리는 함께 누구로 되어가고 있나요?”도 묻습니다.",principleBody:"진행은 중요하지만 완료가 곧 형성은 아닙니다. MRIA는 지식이 해석이 되고, 해석이 참여가 되며, 참여가 섬김이 되는 살아 있는 관계적 공간을 세웁니다.",arc:[["WHERE","질문을 형성하는 삶의 공간을 알아봅니다."],["WHO","관계 안에서 누가 형성되는지 살핍니다."],["WHAT","지금 드러나는 책임을 분별합니다."],["EMBODIED","실제 장소에서 사람들과 함께 실천합니다."]],pathwaysLabel:"다섯 움직임",pathwaysTitle:"이미 당신 안에 있는 질문으로 들어오세요.",pathwaysBody:"하나의 출발점만 있지 않습니다. 각 경로는 무료로 열려 있으며, 심화 과정과 퍼실리테이션 공동체, 삶의 실천으로 이어집니다.",startPath:"이 경로 시작하기",pathNote:"무료 · 이중 언어 · 자기 속도",pathways:[["Cognition in Motion","나의 앎은 어떻게 형성되고 있습니까?","숨은 전제에서 구현된 지혜로.","#147D64"],["Communication in Motion","서로 다른 세계는 어떻게 참으로 만날 수 있습니까?","일방적 말하기에서 해석적 건넘으로.","#6955B8"],["Culture in Motion","지배하지 않으면서 차이를 어떻게 품을 수 있습니까?","물려받은 경계에서 함께하는 상상으로.","#C66A21"],["Care in Motion","신실한 동행에는 무엇이 필요합니까?","개입에서 존엄을 지키는 현존으로.","#B94B61"],["Communion in Motion","개인의 변화는 어떻게 함께하는 삶이 됩니까?","고립된 됨에서 공동선을 향해.","#28749B"]],ecosystemLabel:"움직이는 METAUNIVERSITY",ecosystemTitle:"배움의 여러 길. 하나의 관계적 아키텍처.",ecosystemBody:"MRIA는 각 공동체가 자기 정체성을 지키면서 공개 경로, 안내 과정, 학제 간 프로그램, 기관 파트너십을 함께 담습니다.",ecosystem:[["공개 형성 경로","계정 없이 자유롭게 들어와 하나의 질문을 일곱 움직임으로 따라갑니다.","모든 배우는 사람을 위해","01"],["안내 과정","적응적 준비, 실시간 대화, 실천을 실제 교육자와 함께 공부합니다.","코호트와 공동체를 위해","02"],["형성 프로그램","여러 과정을 전환기, 소명, 공적 삶을 위한 긴 여정으로 연결합니다.","평생의 형성을 위해","03"],["기관 커먼즈","학교와 기관이 자기 강점을 공동 생태계 안에서 나누고 연결합니다.","파트너를 위해","04"]],partnersLabel:"교육자와 기관을 위해",partnersTitle:"당신의 정체성을 가지고, 함께 배우는 커먼즈에 참여하세요.",partnersBody:"MRIA는 흡수가 아니라 파트너십을 위해 설계됩니다. 교육자는 자기 목소리를, 기관은 자기 정체성을 지킵니다. 공유 아키텍처는 경계를 넘어 배움, 대화, 퍼실리테이션, 구현된 참여를 연결합니다.",partnerItems:["이중 언어 과정 공동 설계","퍼실리테이션 코호트 운영","프로그램·인증 연결","관계적 형성 공동 연구"],partnerCta:"파트너십 대화 시작하기",aboutLabel:"METAREALITY RELATIONAL INTELLIGENCE ARCHITECTURE",aboutTitle:"기술은 관계 위가 아니라 관계 안에 있어야 합니다.",aboutBody:"MRIA는 사람과 공동체, 문화와 역사, 기술이 함께 되어가는 살아 있는 관계적 장입니다. MetaGenesis는 생성하고, MetaWay는 움직이며, MetaCommon은 모읍니다. 기술은 여정을 돕지만, 지혜와 돌봄, 판단과 신성한 현존은 사람과 공동체에 남습니다.",core:[["MetaGenesis","생성","새로운 질문과 의미, 가능성이 나타납니다."],["MetaWay","움직임","사람들이 분별하며 세계 사이를 건넙니다."],["MetaCommon","모임","배움이 사랑과 섬김, 함께하는 삶이 됩니다."]],finalTitle:"당신의 질문이 서 있는 곳에서 시작하세요.",finalBody:"들어오기 전에 전체 아키텍처를 이해할 필요는 없습니다. 하나의 경로를 선택하고 첫 움직임을 시작하세요.",finalPrimary:"나의 경로 찾기",finalSecondary:"살아 있는 지도 둘러보기",footerLine:"Human + AI 시대를 위한 관계적 형성.",footerCols:[["둘러보기","배움의 흐름","다섯 움직임","살아 있는 지도"],["참여하기","공개 형성 경로","교육자를 위해","파트너십"],["MRIA","소개","접근성","문의"]],modalLabel:"나의 입구 찾기",modalTitle:"어떻게 MRIA에 들어오고 싶으신가요?",modalBody:"당신에게 가장 가까운 역할을 선택하세요. 계정은 만들어지지 않습니다.",roles:[["배우고 싶습니다","무료 형성 경로에서 시작합니다.","learner"],["가르치거나 퍼실리테이션합니다","학습 모델과 코호트 설계를 살펴봅니다.","educator"],["기관을 대표합니다","기관 정체성을 지키는 파트너십을 살펴봅니다.","institution"]],close:"닫기"}},oi={en:{nav:["How","Learn","Programs","Educators","Partners","About"],navHref:["how","pathways","programs","educators","partners","about"],entry:"Start your path",heroTitleA:"Learning becomes",heroTitleB:"a way of living.",heroBody:"Where am I standing? Formation begins there, not with what to fix. Bring one real question — disagreement that makes listening difficult, say — and MRIA asks where you are standing when it happens, before it asks what to do.",explore:"See what you can do here",partner:"Partner with MRIA",open:"Free · Bilingual · No account",journeyLabel:"THE FIRST MOVE, RIGHT NOW",journeyTitle:"Question to practice",today:"TODAY · 18 MIN",sceneIntro:"A scene: someone you respect says something you believe is wrong, in front of other people.",prompt:"Where are you standing when this happens?",promptBody:"Your honest first reaction shows the place you are answering from. Nothing here is scored.",respond:"Try the first move",handoff:"The screen stops. Real relationship continues.",proof:["Answer a real scene","Compare and decide","Interpret together","Practice with one person"],sectionLabel:"WHAT YOU CAN DO HERE",sectionTitle:"Start where you are standing. Carry it into practice.",sectionBody:"MRIA begins every learning event with one question, and it is not “what should I fix?” Follow it through the four steps below.",sample:"ONE QUESTION · FOUR STEPS",lessonQuestion:"Where am I standing?",lessonQuestionLabel:"THE QUESTION MRIA BEGINS WITH",lessonQuestionScene:"For example: disagreement makes listening difficult. Before asking how to listen better, MRIA asks where you are standing when it happens — what place, relationship, and history are already shaping your reaction.",closeLabel:"AND THE QUESTION MOVES",closeQuestion:"Where are we standing?",closeBody:"The place shaping you is not only yours. Part of it you did not choose and cannot see alone — which is why step 03 needs a person, not a screen.",stepLabel:"STEP",availNow:"Available now",availDev:"Guided learning in development",youDo:"What you do",youSee:"What happens next",liveHint:"Choose one. This is a real first move, not a picture of one.",liveA:"I go quiet and replay it later",liveB:"I answer back right away",liveNextA:"What were you protecting by staying quiet — and who taught you that silence was safer in a room like that?",liveNextB:"What made answering feel urgent — and whose eyes in the room were you answering to?",liveNextLabel:"YOUR NEXT QUESTION",liveNeutral:"Neither answer is better. The question only moves you closer to where you are standing. Change your answer to see the difference.",lessonSteps:[["Adaptive learning","You answer — and the next question follows your answer","Read a short, real scene: someone you respect says something you believe is wrong, in front of other people. Choose your honest first reaction — it shows the place you are answering from.","now"],["Active learning","You compare two readings, choose one, and say why","See two honest ways of reading the same moment. Pick the one closer to yours and write one sentence explaining why — that sentence names your location more precisely than the choice did.","now"],["Human facilitation","A person helps you see the place you cannot see alone","In a guided session, a facilitator helps participants notice where their readings differ, and names the part of your location you could not have seen by yourself.","dev"],["Embodied practice","You try one listening practice with a real person","Take one listening practice into a real conversation this week. Afterward, note in your own words what changed in you and in the other person.","now"]],outcomeLabel:"WHAT YOU LEAVE WITH",outcomeItems:["A clearer understanding of what shaped your response.","One listening practice to try in real life."],outcomeNote:"Nothing is scored, ranked, or profiled. Your words stay with you.",lessonCta:"Try the Communication walk",lessonAvail:"Available now · Free · Bilingual · No account",adaptiveBody:"Begin where you are. Readiness is not identity.",activeBody:"Decide, experiment, dialogue, and interpret together.",facilitatedBody:"An educator notices, questions, holds difference, and accompanies.",embodiedBody:"Learning enters a body, place, relationship, and responsibility.",principleTitle:"Beyond “What did you finish?”",principleAccent:"Toward “Who are we becoming together?”",principleBody:"Knowledge becomes interpretation, participation, and service.",arc:[["WHERE","Name your life-space."],["WHO","Notice who is becoming."],["WHAT","Discern responsibility."],["EMBODIED","Practice with people."]],pathwaysTitle:"Five real questions. Pick the one you are living.",pathwaysBody:"Each pathway starts from a situation, not a syllabus — and each one begins by asking where you are standing. Every walk below is free to take right now.",startPath:"Open pathway",forExample:"A SITUATION YOU MIGHT BRING",firstMoveLabel:"YOUR FIRST MOVE · WHERE",pathways:[["Cognition in Motion","How is my knowing formed?","Assumption → wisdom","#147D64"],["Communication in Motion","How can worlds meet?","Speech → crossing","#6955B8"],["Culture in Motion","How can difference live?","Borders → imagination","#C66A21"],["Care in Motion","How do we accompany?","Intervention → presence","#B94B61"],["Communion in Motion","How does change become shared?","Isolation → common good","#28749B"]],pathwayDetail:[["You were certain about something for years, and one conversation made it look thin.","Name the place your certainty was formed — the room, the people, the years — before judging whether it still holds."],["Disagreement makes listening difficult, and you go quiet or push back.","Name where you are standing when it starts: who is watching, and what you are protecting."],["Your team or family holds a difference nobody will say out loud.","Name the border you inherited without choosing it, and who drew it."],["Someone near you is struggling and your help keeps landing wrong.","Name where you are standing when you offer help: above them, beside them, or outside."],["Something changed in you, and it has nowhere to go in your community.","Name the place your change has no room in yet, and who else is standing there."]],ecosystemLabel:"METAUNIVERSITY",ecosystemTitle:"Many forms. One living architecture.",ecosystemBody:"Move from question to course, cohort, program, and practice.",ecosystem:[["Open pathways","Free entry through a lived question.","For learners","01"],["Guided courses","Preparation, dialogue, and practice.","For cohorts","02"],["Formation programs","Longer journeys for life and vocation.","For communities","03"],["Institutional commons","Shared architecture, distinct identities.","For partners","04"]],partnersLabel:"BUILD TOGETHER",partnersTitle:"Keep your identity. Share your strength.",partnersBody:"MRIA connects institutions without making them identical.",partnerItems:["Co-design a course","Host a cohort","Connect a program","Research together"],partnerCta:"Explore partnerships",aboutTitle:"Technology inside relationship.",aboutBody:"A living field where people, communities, cultures, histories, and technologies become together.",core:[["MetaGenesis","Generate","Life and meaning emerge."],["MetaWay","Move","People discern and cross."],["MetaCommon","Gather","Learning becomes shared life."]],finalTitle:"Begin with one question.",finalBody:"Choose a pathway. Take one movement into life.",finalPrimary:"Choose a pathway",finalSecondary:"Enter the 3D Rhizome",modalLabel:"START HERE",modalTitle:"Choose your way in.",modalBody:"No account required.",roles:[["Learn","Open a free pathway.","learner"],["Teach","Explore educator design.","educator"],["Partner","Build without losing identity.","institution"]]},ko:{nav:["배움","배우기","프로그램","교육자","파트너","소개"],navHref:["how","pathways","programs","educators","partners","about"],entry:"나의 경로 시작",heroTitleA:"배움이",heroTitleB:"삶이 됩니다.",heroBody:"나는 어디에 서 있습니까? 형성은 무엇을 고칠지가 아니라 거기에서 시작합니다. 하나의 실제 질문을 가져오세요 — 예를 들어 의견 충돌로 경청이 어려워질 때. MRIA는 무엇을 할지 묻기 전에, 그때 내가 어디에 서 있는지 묻습니다.",explore:"여기서 할 수 있는 배움 보기",partner:"MRIA와 협력하기",open:"무료 · 이중 언어 · 계정 없음",journeyLabel:"지금 시작하는 첫 움직임",journeyTitle:"질문에서 실천으로",today:"오늘 · 18분",sceneIntro:"장면: 내가 존중하는 사람이 여러 사람 앞에서 내가 틀렸다고 생각하는 말을 합니다.",prompt:"이때 나는 어디에 서 있습니까?",promptBody:"솔직한 첫 반응은 내가 어디에서 답하고 있는지를 보여줍니다. 여기에 점수는 없습니다.",respond:"첫 움직임 시작하기",handoff:"화면은 멈추고, 실제 관계가 이어집니다.",proof:["실제 장면에 답하기","비교하고 결정하기","함께 해석하기","한 사람과 실천하기"],sectionLabel:"여기서 할 수 있는 배움",sectionTitle:"서 있는 자리에서 시작해, 실천으로 가져가세요.",sectionBody:"MRIA는 모든 배움을 하나의 질문에서 시작합니다. 그것은 “무엇을 고쳐야 하나?”가 아닙니다. 아래 네 단계에서 그 질문을 따라가 보세요.",sample:"하나의 질문 · 네 단계",lessonQuestion:"나는 어디에 서 있습니까?",lessonQuestionLabel:"MRIA가 시작하는 질문",lessonQuestionScene:"예: 의견 충돌로 경청이 어려워집니다. 어떻게 더 잘 들을지 묻기 전에, MRIA는 그때 내가 어디에 서 있는지 묻습니다 — 어떤 장소와 관계와 역사가 이미 나의 반응을 형성하고 있는지.",closeLabel:"그리고 질문이 움직입니다",closeQuestion:"우리는 어디에 서 있습니까?",closeBody:"나를 형성하는 자리는 나만의 것이 아닙니다. 그 일부는 내가 선택하지 않았고 혼자서는 볼 수 없습니다. 그래서 03단계에는 화면이 아니라 사람이 필요합니다.",stepLabel:"단계",availNow:"지금 이용 가능",availDev:"안내 학습은 준비 중",youDo:"내가 하는 것",youSee:"다음에 일어나는 일",liveHint:"하나를 선택하세요. 미리보기가 아니라 실제 첫 움직임입니다.",liveA:"조용해지고 나중에 되새깁니다",liveB:"곧바로 반박합니다",liveNextA:"조용해지면서 무엇을 지키고 있었습니까 — 그리고 그런 자리에서는 침묵이 더 안전하다고 누가 가르쳤습니까?"
